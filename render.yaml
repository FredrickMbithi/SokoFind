services:
  - type: web
    name: sokofind
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sokofind-db
          property: connectionString
      - key: AUTO_MIGRATE
        value: "1"
      - key: APP_TIMEZONE
        value: Africa/Nairobi
      - key: PORT
        value: "10000"

databases:
  - name: sokofind-db
    databaseName: sokofind
    user: sokofind
    plan: free
    region: oregon
